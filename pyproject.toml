[project]
name = "csv-data-cleaner"
version = "0.1.0"
description = "A configurable CLI for cleaning, validating, deduplicating, and reporting on CSV and Excel data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "hamresan" }]
dependencies = [
    "click>=8.1,<9",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
]

[project.scripts]
csv-data-cleaner = "csv_data_cleaner.presentation.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_data_cleaner"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
