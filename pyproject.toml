[project]
name = "csv-data-cleaner"
version = "0.1.0"
description = "A configurable CLI for cleaning, validating, deduplicating, and reporting on CSV and Excel data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hamresan" }]
keywords = ["csv", "xlsx", "data-cleaning", "data-validation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1,<9",
    "email-validator>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/hamresan/csv-data-cleaner"
Repository = "https://github.com/hamresan/csv-data-cleaner"
Issues = "https://github.com/hamresan/csv-data-cleaner/issues"

[project.scripts]
csv-data-cleaner = "csv_data_cleaner.presentation.cli:main"

[dependency-groups]
dev = [
    "pandas-stubs>=2.2,<3",
    "pyright>=1.1.390",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_data_cleaner"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["csv_data_cleaner"]

[tool.coverage.report]
fail_under = 85
show_missing = true
